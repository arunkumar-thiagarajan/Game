<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Unicorn vs Aliens</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:radial-gradient(ellipse at center,#0a0015 0%,#000 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:100vh;font-family:'Courier New',monospace;overflow:hidden;
    }
    #gameContainer{position:relative;border:2px solid #7c3aed;border-radius:6px;
      box-shadow:0 0 60px #7c3aed88,0 0 120px #4c1d9544;}
    canvas{display:block}
    #ui{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
      padding:8px 14px;pointer-events:none;z-index:10;}
    .ui-panel{background:rgba(0,0,0,0.7);border:1px solid #7c3aed88;border-radius:5px;
      padding:4px 11px;color:#e9d5ff;font-size:13px;font-weight:bold;letter-spacing:1px;
      text-shadow:0 0 8px #a855f7;}
    #message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.88);border:2px solid #a855f7;border-radius:14px;
      padding:28px 48px;color:#f0abfc;font-size:24px;font-weight:bold;text-align:center;
      text-shadow:0 0 12px #d946ef;display:none;z-index:20;pointer-events:none;min-width:320px;}
    #message .sub{font-size:13px;margin-top:10px;color:#c4b5fd;line-height:1.7}
    #controls{margin-top:8px;color:#6d28d988;font-size:11px;letter-spacing:1px;text-align:center;}
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="480"></canvas>
  <div id="ui">
    <div class="ui-panel">⭐ <span id="score">0</span></div>
    <div class="ui-panel" id="levelDisplay">WORLD 1-1</div>
    <div class="ui-panel">🦄 <span id="lives">3</span>  &nbsp; 🔫 <span id="ammo">∞</span></div>
  </div>
  <div id="message">
    <div id="msgTitle">UNICORN vs ALIENS</div>
    <div class="sub" id="msgSub">Press SPACE to start!<br>Arrow Keys: Move &nbsp;|&nbsp; W/Space: Jump (double-jump!)<br>Z / Ctrl: Shoot laser from horn</div>
  </div>
</div>
<div id="controls">Move: ←→ or A/D &nbsp;|&nbsp; Jump: W / Space / ↑ &nbsp;|&nbsp; Laser: Z / Ctrl &nbsp;|&nbsp; Stomp aliens from above!</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ─── Physics constants ──────────────────────────────────────────────────────
const GRAVITY   = 0.52;
const JUMP_F    = -13.5;
const SPEED     = 4.8;
const TILE      = 32;

// ─── State ──────────────────────────────────────────────────────────────────
let state='title', score=0, lives=3, level=0;
let camera={x:0};
let particles=[], lasers=[], alienBullets=[];
let bgStars=[], nebulae=[];
let frameCount=0;
let laserCooldown=0;
let rainbowTrail=[];

// ─── Input ──────────────────────────────────────────────────────────────────
const keys={}, justP={};
document.addEventListener('keydown', e=>{
  if(!keys[e.code]) justP[e.code]=true;
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e=>{ keys[e.code]=false; });
function isDown(...c){ return c.some(k=>keys[k]); }
function wasPressed(...c){ const r=c.some(k=>justP[k]); c.forEach(k=>delete justP[k]); return r; }

// ─── Level data ─────────────────────────────────────────────────────────────
function makeLevels(){
  return [
    { bg1:'#05001a',bg2:'#0a0030',
      platforms:[
        ...gRow(0,11),...gRow(16,60),
        {x:4,y:10,w:4},{x:9,y:8,w:3},{x:13,y:9,w:3},
        {x:18,y:8,w:4},{x:23,y:10,w:3},{x:27,y:7,w:4},
        {x:31,y:9,w:3},{x:35,y:8,w:3},{x:39,y:6,w:4},
        {x:43,y:9,w:3},{x:47,y:7,w:3},{x:51,y:8,w:3},
      ],
      coins:[
        {x:4,y:8},{x:5,y:8},{x:6,y:8},{x:7,y:8},
        {x:9,y:6},{x:10,y:6},{x:11,y:6},
        {x:18,y:6},{x:19,y:6},{x:20,y:6},{x:21,y:6},
        {x:27,y:5},{x:28,y:5},{x:29,y:5},{x:30,y:5},
        {x:35,y:6},{x:36,y:6},{x:37,y:6},
        {x:39,y:4},{x:40,y:4},{x:41,y:4},{x:42,y:4},
        {x:51,y:6},{x:52,y:6},
      ],
      aliens:[
        {x:7,dir:1,type:'walker'},{x:14,dir:-1,type:'ufo'},
        {x:20,dir:1,type:'walker'},{x:26,dir:-1,type:'walker'},
        {x:33,dir:1,type:'ufo'},{x:38,dir:-1,type:'walker'},
        {x:44,dir:1,type:'walker'},{x:50,dir:-1,type:'ufo'},
      ],
      flagX:54, worldW:58*TILE,
    },
    { bg1:'#000d1a',bg2:'#001433',
      platforms:[
        ...gRow(0,13),...gRow(18,70),
        {x:5,y:10,w:4},{x:10,y:8,w:3},{x:14,y:7,w:3},
        {x:20,y:9,w:3},{x:24,y:7,w:3},{x:28,y:5,w:4},
        {x:33,y:9,w:4},{x:38,y:7,w:3},{x:42,y:5,w:4},
        {x:47,y:8,w:3},{x:51,y:6,w:3},{x:55,y:9,w:3},
        {x:59,y:7,w:4},{x:64,y:5,w:3},{x:68,y:8,w:3},
      ],
      coins:[
        {x:5,y:8},{x:6,y:8},{x:7,y:8},{x:8,y:8},
        {x:10,y:6},{x:11,y:6},{x:12,y:6},
        {x:20,y:7},{x:21,y:7},{x:22,y:7},
        {x:24,y:5},{x:25,y:5},{x:26,y:5},
        {x:28,y:3},{x:29,y:3},{x:30,y:3},{x:31,y:3},
        {x:38,y:5},{x:39,y:5},{x:40,y:5},
        {x:42,y:3},{x:43,y:3},{x:44,y:3},{x:45,y:3},
        {x:51,y:4},{x:52,y:4},{x:53,y:4},
        {x:59,y:5},{x:60,y:5},{x:61,y:5},{x:62,y:5},
        {x:64,y:3},{x:65,y:3},{x:66,y:3},
      ],
      aliens:[
        {x:6,dir:1,type:'walker'},{x:11,dir:-1,type:'walker'},
        {x:15,dir:1,type:'ufo'},{x:21,dir:-1,type:'walker'},
        {x:25,dir:1,type:'walker'},{x:29,dir:-1,type:'ufo'},
        {x:34,dir:1,type:'walker'},{x:39,dir:-1,type:'walker'},
        {x:43,dir:1,type:'ufo'},{x:48,dir:-1,type:'walker'},
        {x:52,dir:1,type:'walker'},{x:56,dir:-1,type:'ufo'},
        {x:60,dir:1,type:'walker'},{x:65,dir:-1,type:'ufo'},
      ],
      flagX:70, worldW:75*TILE,
    },
  ];
}

function gRow(s,e){ const a=[]; for(let x=s;x<e;x++) a.push({x,y:H/TILE-1,w:1,ground:true}); return a; }

let levels,currentDef,player,platforms,coins,aliens,flag;

// ─── Init ────────────────────────────────────────────────────────────────────
function initBg(){
  bgStars=[];
  for(let i=0;i<120;i++) bgStars.push({
    x:Math.random()*4000, y:Math.random()*H*0.85,
    r:Math.random()*1.8+0.2, tw:Math.random()*Math.PI*2,
    hue:Math.random()<0.15?`hsl(${Math.random()*60+200},80%,70%)`:'#fff',
  });
  nebulae=[];
  for(let i=0;i<5;i++) nebulae.push({
    x:Math.random()*3000+200, y:Math.random()*H*0.6+20,
    rx:80+Math.random()*120, ry:40+Math.random()*60,
    hue:Math.floor(Math.random()*360), a:0.06+Math.random()*0.08,
  });
}

function loadLevel(idx){
  currentDef=levels[idx];
  camera.x=0; particles=[]; lasers=[]; alienBullets=[]; rainbowTrail=[];
  laserCooldown=0;

  platforms=currentDef.platforms.map(p=>({
    x:p.x*TILE, y:p.y*TILE, w:p.w*TILE, h:TILE, ground:!!p.ground,
  }));

  coins=currentDef.coins.map(c=>({
    x:c.x*TILE+TILE/2, y:c.y*TILE+TILE/2, collected:false, bob:Math.random()*Math.PI*2,
  }));

  aliens=currentDef.aliens.map(e=>{
    const gy=H-TILE*2;
    return {
      x:e.x*TILE, y:gy, w:e.type==='ufo'?44:28, h:e.type==='ufo'?32:36,
      vx:e.dir*(e.type==='ufo'?1.2:1.6), vy:0,
      alive:true, squished:false, squishTimer:0,
      type:e.type, hp:e.type==='ufo'?2:1,
      shootTimer:Math.random()*120+60,
      hoverOffset:Math.random()*Math.PI*2,
    };
  });

  flag={ x:currentDef.flagX*TILE, y:H-TILE*6, w:TILE, h:TILE*5, reached:false };

  player={
    x:2*TILE, y:H-TILE*3, w:36, h:38,
    vx:0, vy:0,
    onGround:false, jumpsLeft:2,
    facing:1, alive:true,
    invincible:0, deathTimer:0,
    animFrame:0, animTimer:0,
    running:false,
    wingAngle:0, wingFlap:0, wingSpread:0,
    hornGlow:0,
  };
  document.getElementById('levelDisplay').textContent=`WORLD ${idx+1}-1`;
  updateHUD();
}

function init(){
  levels=makeLevels(); level=0; score=0; lives=3;
  initBg(); loadLevel(0); updateHUD();
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent=lives;
}
function showMsg(t,s,hide){
  const m=document.getElementById('message');
  document.getElementById('msgTitle').textContent=t;
  document.getElementById('msgSub').innerHTML=s;
  m.style.display='block';
  if(hide) setTimeout(()=>{ m.style.display='none'; },hide);
}
function hideMsg(){ document.getElementById('message').style.display='none'; }

// ─── Particles ───────────────────────────────────────────────────────────────
function burst(x,y,n,colors,speed=4,size=5){
  for(let i=0;i<n;i++){
    const a=(Math.PI*2*i)/n+Math.random()*0.8;
    const s=speed*0.5+Math.random()*speed;
    particles.push({
      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1.5,
      life:1, decay:0.025+Math.random()*0.025,
      color:colors[i%colors.length],
      size:size*0.5+Math.random()*size*0.8,
    });
  }
}

function laserHitBurst(x,y){
  burst(x,y,14,['#00ffff','#7fffd4','#39ff14','#00ff88','#ffffff'],6,6);
}
function coinBurst(x,y){ burst(x,y,10,['#fbbf24','#fde68a','#fff9c4','#fcd34d'],5,5); }
function deathBurst(x,y){ burst(x,y,20,['#f472b6','#a855f7','#c4b5fd','#38bdf8'],7,7); }
function wingBurst(x,y){ burst(x,y,6,['#f9a8d4','#c4b5fd','#93c5fd','#6ee7b7'],3,3); }

function updateParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=p.decay; });
}

// ─── Collision ───────────────────────────────────────────────────────────────
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

function resolveY(ent,plat){
  const ox=Math.min(ent.x+ent.w,plat.x+plat.w)-Math.max(ent.x,plat.x);
  const oy=Math.min(ent.y+ent.h,plat.y+plat.h)-Math.max(ent.y,plat.y);
  if(ox<=0||oy<=0) return;
  if(oy<=ox){
    if(ent.y+ent.h/2<plat.y+plat.h/2){
      ent.y=plat.y-ent.h; if(ent.vy>0){ent.vy=0;ent.onGround=true;if(ent===player) player.jumpsLeft=2;}
    } else {
      ent.y=plat.y+plat.h; if(ent.vy<0) ent.vy=0;
    }
  } else {
    if(ent.x+ent.w/2<plat.x+plat.w/2){ ent.x=plat.x-ent.w; } else { ent.x=plat.x+ent.w; }
    ent.vx=0;
  }
}

// ─── Laser firing ────────────────────────────────────────────────────────────
function fireLaser(){
  if(laserCooldown>0) return;
  laserCooldown=18;
  player.hornGlow=20;
  // Horn tip approx position
  const hx=player.x+(player.facing>0?player.w+14:- 14);
  const hy=player.y+2;
  lasers.push({
    x:hx, y:hy, vx:player.facing*16, vy:-0.5,
    life:1, decay:0.015, w:40, h:6,
  });
  // Sparkle at horn
  burst(hx,hy,6,['#00ffff','#f0abfc','#fff','#a5f3fc'],4,3);
}

// ─── Update ──────────────────────────────────────────────────────────────────
function update(){
  frameCount++;
  if(laserCooldown>0) laserCooldown--;
  if(player.invincible>0) player.invincible--;
  if(player.hornGlow>0) player.hornGlow--;

  const goL=isDown('ArrowLeft','KeyA');
  const goR=isDown('ArrowRight','KeyD');
  const jump=wasPressed('Space','ArrowUp','KeyW');
  const shoot=wasPressed('KeyZ','ControlLeft','ControlRight');

  // Movement
  if(goL){ player.vx=-SPEED; player.facing=-1; }
  else if(goR){ player.vx=SPEED; player.facing=1; }
  else player.vx*=0.72;
  player.running=Math.abs(player.vx)>1;

  // Jump
  if(jump&&player.jumpsLeft>0){
    player.vy=JUMP_F-(player.jumpsLeft===1?1.5:0);
    player.jumpsLeft--;
    wingBurst(player.x+player.w/2,player.y+player.h*0.3);
  }

  // Shoot
  if(shoot) fireLaser();
  if(isDown('KeyZ','ControlLeft','ControlRight')&&laserCooldown===0) fireLaser();

  // Gravity & move
  player.vy=Math.min(player.vy+GRAVITY,18);
  player.x+=player.vx;
  player.onGround=false;
  if(player.x<0){ player.x=0; player.vx=0; }

  // X collisions
  platforms.forEach(plat=>{
    if(overlap(player.x,player.y,player.w,player.h,plat.x,plat.y,plat.w,plat.h)){
      const oy=Math.min(player.y+player.h,plat.y+plat.h)-Math.max(player.y,plat.y);
      const ox=Math.min(player.x+player.w,plat.x+plat.w)-Math.max(player.x,plat.x);
      if(ox<oy){
        if(player.x+player.w/2<plat.x+plat.w/2) player.x=plat.x-player.w;
        else player.x=plat.x+plat.w;
        player.vx=0;
      }
    }
  });

  player.y+=player.vy;
  platforms.forEach(plat=>{
    if(overlap(player.x,player.y,player.w,player.h,plat.x,plat.y,plat.w,plat.h))
      resolveY(player,plat);
  });

  // Wing animation
  player.wingFlap+=player.onGround?0.06:0.2;
  player.wingSpread=player.onGround?0.3:1;
  if(!player.onGround) player.wingAngle=Math.sin(player.wingFlap)*0.6*player.wingSpread;

  // Anim
  player.animTimer++;
  if(player.running&&player.animTimer%6===0) player.animFrame=(player.animFrame+1)%4;
  if(!player.running) player.animFrame=0;

  // Rainbow trail
  if(player.running||!player.onGround){
    rainbowTrail.push({
      x:player.x+player.w/2-player.facing*12,
      y:player.y+player.h*0.65,
      life:1, decay:0.06,
      color:`hsl(${(frameCount*9)%360},90%,65%)`,
      size:5+Math.random()*4,
    });
  }
  rainbowTrail=rainbowTrail.filter(t=>t.life>0);
  rainbowTrail.forEach(t=>{ t.life-=t.decay; t.size*=0.95; });

  // Lasers
  lasers=lasers.filter(l=>l.life>0&&l.x>-100&&l.x<currentDef.worldW+100);
  lasers.forEach(l=>{ l.x+=l.vx; l.y+=l.vy; l.life-=l.decay; });

  // Laser vs alien collision
  lasers.forEach(l=>{
    if(l.dead) return;
    aliens.forEach(a=>{
      if(!a.alive) return;
      if(overlap(l.x-l.w/2,l.y-l.h/2,l.w,l.h,a.x,a.y,a.w,a.h)){
        a.hp--;
        laserHitBurst(a.x+a.w/2,a.y+a.h/2);
        l.life=0; l.dead=true;
        if(a.hp<=0){
          killAlien(a);
          score+=a.type==='ufo'?300:150;
          updateHUD();
        }
      }
    });
  });

  // Alien bullets
  alienBullets=alienBullets.filter(b=>b.life>0);
  alienBullets.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=0.08; b.life-=0.012; });

  // Bullet vs player
  if(!player.invincible){
    alienBullets.forEach(b=>{
      if(overlap(b.x-4,b.y-4,8,8,player.x,player.y,player.w,player.h)){
        b.life=0;
        killPlayer();
      }
    });
  }

  // Aliens
  aliens.forEach(a=>{
    if(!a.alive){ if(a.squishTimer>0) a.squishTimer--; return; }
    a.shootTimer--;

    if(a.type==='ufo'){
      // UFO hovers above platforms
      a.hoverOffset+=0.04;
      a.y=H-TILE*4-Math.sin(a.hoverOffset)*18;
      a.x+=a.vx;
      if(a.x<0){ a.x=0; a.vx=Math.abs(a.vx); }
      if(a.x+a.w>currentDef.worldW){ a.x=currentDef.worldW-a.w; a.vx=-Math.abs(a.vx); }
      // UFO shoots downward bombs
      if(a.shootTimer<=0){
        a.shootTimer=90+Math.random()*80;
        alienBullets.push({ x:a.x+a.w/2,y:a.y+a.h, vx:(Math.random()-0.5)*1.5,vy:3, life:1,type:'bomb' });
      }
    } else {
      // Walker
      a.vy+=GRAVITY; a.y+=a.vy; a.x+=a.vx;
      a.onGround=false;
      platforms.forEach(plat=>{
        if(overlap(a.x,a.y,a.w,a.h,plat.x,plat.y,plat.w,plat.h)){
          const oy=Math.min(a.y+a.h,plat.y+plat.h)-Math.max(a.y,plat.y);
          const ox=Math.min(a.x+a.w,plat.x+plat.w)-Math.max(a.x,plat.x);
          if(oy<=ox){ if(a.y+a.h/2<plat.y+plat.h/2){ a.y=plat.y-a.h;a.vy=0;a.onGround=true; } }
          else{ a.vx*=-1; }
        }
      });
      // Turn at edge
      const ahead=platforms.some(p=>p.ground&&
        p.x<=a.x+(a.vx>0?a.w+4:-4)&&p.x+p.w>=a.x+(a.vx>0?a.w+4:-4));
      if(!ahead&&a.onGround) a.vx*=-1;
      if(a.x<0){ a.x=0;a.vx=Math.abs(a.vx); }
      if(a.x+a.w>currentDef.worldW){ a.x=currentDef.worldW-a.w;a.vx=-Math.abs(a.vx); }
      // Walker shoots toward player
      if(a.shootTimer<=0&&Math.abs(a.x-player.x)<320){
        a.shootTimer=80+Math.random()*60;
        const dx=player.x-a.x, dy=player.y-a.y;
        const dist=Math.sqrt(dx*dx+dy*dy)||1;
        alienBullets.push({ x:a.x+a.w/2,y:a.y+a.h*0.4, vx:(dx/dist)*4,vy:(dy/dist)*4-1,life:1,type:'ray' });
      }
    }

    // Stomp from above
    if(!player.invincible&&overlap(player.x,player.y,player.w,player.h,a.x,a.y,a.w,a.h)){
      if(player.vy>0&&player.y+player.h<a.y+a.h*0.55){
        killAlien(a);
        player.vy=JUMP_F*0.55;
        score+=a.type==='ufo'?300:150;
        updateHUD();
      } else {
        if(!player.invincible) killPlayer();
      }
    }
  });

  // Coins
  coins.forEach(c=>{
    if(c.collected) return;
    if(Math.abs(player.x+player.w/2-c.x)<22&&Math.abs(player.y+player.h/2-c.y)<22){
      c.collected=true; score+=100; coinBurst(c.x,c.y); updateHUD();
    }
  });

  // Flag
  if(!flag.reached&&overlap(player.x,player.y,player.w,player.h,flag.x,flag.y,flag.w,flag.h)){
    flag.reached=true; score+=500; updateHUD();
    setTimeout(()=>nextLevel(),2000);
  }

  // Fall
  if(player.y>H+80) killPlayer();

  // Camera
  const tcam=player.x-W*0.35;
  camera.x+=(tcam-camera.x)*0.12;
  camera.x=Math.max(0,Math.min(camera.x,currentDef.worldW-W));

  bgStars.forEach(s=>s.tw+=0.03);
  updateParticles();
}

function killAlien(a){
  a.alive=false; a.squished=true; a.squishTimer=35;
  burst(a.x+a.w/2,a.y+a.h/2,16,['#39ff14','#00ffff','#7fff00','#adff2f','#fff'],5,6);
}
function killPlayer(){
  if(player.invincible>0) return;
  lives--; updateHUD(); deathBurst(player.x+player.w/2,player.y+player.h/2);
  if(lives<=0){ state='gameover'; showMsg('GAME OVER','Press SPACE to try again!'); return; }
  state='dead'; player.alive=false; player.vy=JUMP_F*1.1;
  setTimeout(()=>{ loadLevel(level); state='playing'; player.invincible=120; },1500);
}
function nextLevel(){
  level++;
  if(level>=levels.length){
    state='win';
    showMsg('🦄 VICTORY!',`You saved the galaxy!<br>Score: ${score}<br>Press SPACE to play again!`);
    return;
  }
  loadLevel(level);
  showMsg(`WORLD ${level+1}-1`,'Get ready!',1600);
}

// ─── Drawing ──────────────────────────────────────────────────────────────────

// ── Background ──
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,currentDef.bg1); g.addColorStop(1,currentDef.bg2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Nebulae
  nebulae.forEach(n=>{
    const nx=((n.x-camera.x*0.07)%(W+300)+W+300)%(W+300)-150;
    const ng=ctx.createRadialGradient(nx,n.y,0,nx,n.y,n.rx);
    ng.addColorStop(0,`hsla(${n.hue},80%,50%,${n.a})`);
    ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng; ctx.beginPath();
    ctx.ellipse(nx,n.y,n.rx,n.ry,0,0,Math.PI*2); ctx.fill();
  });

  // Stars
  bgStars.forEach(s=>{
    const sx=((s.x-camera.x*0.05)%(W+200)+W+200)%(W+200)-100;
    const a=0.4+0.6*Math.abs(Math.sin(s.tw));
    ctx.globalAlpha=a; ctx.fillStyle=s.hue;
    ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // Distant planet silhouette
  ctx.fillStyle='rgba(30,10,60,0.3)';
  ctx.beginPath(); ctx.arc(W-160-camera.x*0.02,90,70,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(120,60,200,0.2)'; ctx.lineWidth=12;
  ctx.beginPath(); ctx.arc(W-160-camera.x*0.02,90,90,-0.6,Math.PI+0.6); ctx.stroke();

  // Horizon mist
  const hmist=ctx.createLinearGradient(0,H*0.6,0,H);
  hmist.addColorStop(0,'transparent');
  hmist.addColorStop(1,'rgba(20,0,50,0.35)');
  ctx.fillStyle=hmist; ctx.fillRect(0,0,W,H);
}

// ── Platform ──
function drawPlatform(p){
  const px=p.x-camera.x, py=p.y;
  if(px+p.w<-4||px>W+4) return;

  if(p.ground){
    const g=ctx.createLinearGradient(px,py,px,py+p.h);
    g.addColorStop(0,'#5b21b6'); g.addColorStop(0.35,'#4c1d95'); g.addColorStop(1,'#2e1065');
    ctx.fillStyle=g; ctx.fillRect(px,py,p.w,p.h);
    // Glowing top edge
    ctx.fillStyle='#8b5cf6'; ctx.fillRect(px,py,p.w,3);
    ctx.fillStyle='rgba(196,181,253,0.6)'; ctx.fillRect(px,py,p.w,1);
    // Subtle grid
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
    for(let gx=px;gx<px+p.w;gx+=TILE){ ctx.beginPath();ctx.moveTo(gx,py);ctx.lineTo(gx,py+p.h);ctx.stroke(); }
    // Pixel dots
    ctx.fillStyle='rgba(139,92,246,0.4)';
    for(let gx=px+8;gx<px+p.w;gx+=TILE){ ctx.fillRect(gx,py+8,4,4); }
  } else {
    const g=ctx.createLinearGradient(px,py,px,py+p.h);
    g.addColorStop(0,'#7c3aed'); g.addColorStop(0.6,'#5b21b6'); g.addColorStop(1,'#3b0764');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.roundRect(px,py,p.w,p.h,5); ctx.fill();
    // Shine
    ctx.fillStyle='rgba(255,255,255,0.14)';
    ctx.beginPath(); ctx.roundRect(px+3,py+3,p.w-6,6,3); ctx.fill();
    // Glow outline
    ctx.strokeStyle='rgba(167,139,250,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(px,py,p.w,p.h,5); ctx.stroke();
    // Energy sparks
    for(let i=0;i<p.w/TILE;i++){
      const sx=px+i*TILE+(frameCount*2+i*17)%TILE;
      ctx.fillStyle='rgba(167,139,250,0.35)';
      ctx.fillRect(sx,py+1,2,2);
    }
  }
}

// ── Flag ──
function drawFlag(f){
  const fx=f.x-camera.x;
  ctx.strokeStyle='#d1d5db'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(fx+f.w/2,f.y+f.h); ctx.lineTo(fx+f.w/2,f.y); ctx.stroke();
  const wave=Math.sin(frameCount*0.12)*5;
  const fg=ctx.createLinearGradient(fx+f.w/2,f.y,fx+f.w/2+34,f.y+22);
  fg.addColorStop(0,'#a855f7'); fg.addColorStop(1,'#ec4899');
  ctx.fillStyle=fg;
  ctx.beginPath();
  ctx.moveTo(fx+f.w/2,f.y);
  ctx.quadraticCurveTo(fx+f.w/2+18+wave,f.y+10,fx+f.w/2+32+wave,f.y+11);
  ctx.lineTo(fx+f.w/2,f.y+22); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fbbf24';
  ctx.save(); ctx.translate(fx+f.w/2,f.y); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill(); ctx.restore();
}

// ── Star coin ──
function drawCoin(c){
  if(c.collected) return;
  const cx=c.x-camera.x, cy=c.y+Math.sin(frameCount*0.07+c.bob)*4;
  // Glow
  const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,16);
  grd.addColorStop(0,'rgba(251,191,36,0.45)'); grd.addColorStop(1,'rgba(251,191,36,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,16,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(frameCount*0.05);
  ctx.fillStyle='#fbbf24'; ctx.shadowBlur=10; ctx.shadowColor='#fde68a';
  star5(0,0,5,11); ctx.fillStyle='#fff9c4'; star5(0,0,3,6.5);
  ctx.restore();
}
function star5(cx,cy,r1,r2){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=(i*Math.PI)/5-Math.PI/2, r=i%2===0?r2:r1;
    i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)
         :ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill();
}

// ── Lasers ──
function drawLasers(){
  lasers.forEach(l=>{
    const lx=l.x-camera.x;
    ctx.save();
    // Outer glow
    ctx.globalAlpha=l.life*0.4;
    ctx.fillStyle='#00ffff';
    ctx.shadowBlur=20; ctx.shadowColor='#00ffff';
    ctx.fillRect(lx-l.w/2-4,l.y-l.h/2-4,l.w+8,l.h+8);
    // Core beam
    ctx.globalAlpha=l.life;
    const bg=ctx.createLinearGradient(lx-l.w/2,0,lx+l.w/2,0);
    bg.addColorStop(0,'#f0abfc'); bg.addColorStop(0.3,'#00ffff'); bg.addColorStop(0.7,'#39ff14'); bg.addColorStop(1,'#fff');
    ctx.fillStyle=bg; ctx.shadowBlur=14; ctx.shadowColor='#00ffff';
    ctx.fillRect(lx-l.w/2,l.y-l.h/2,l.w,l.h);
    // Bright center
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.fillRect(lx-l.w/2+2,l.y-1,l.w-4,2);
    ctx.restore();
  });
}

// ── Alien bullets ──
function drawAlienBullets(){
  alienBullets.forEach(b=>{
    const bx=b.x-camera.x;
    ctx.save();
    if(b.type==='ray'){
      ctx.globalAlpha=b.life;
      ctx.fillStyle='#ff4444'; ctx.shadowBlur=12; ctx.shadowColor='#ff0000';
      ctx.beginPath(); ctx.arc(bx,b.y,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffaaaa';
      ctx.beginPath(); ctx.arc(bx,b.y,2,0,Math.PI*2); ctx.fill();
    } else {
      // bomb
      ctx.globalAlpha=b.life;
      const bg=ctx.createRadialGradient(bx,b.y,0,bx,b.y,7);
      bg.addColorStop(0,'#ff8800'); bg.addColorStop(0.5,'#ff4400'); bg.addColorStop(1,'#440000');
      ctx.fillStyle=bg; ctx.shadowBlur=10; ctx.shadowColor='#ff6600';
      ctx.beginPath(); ctx.arc(bx,b.y,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,200,0,0.6)';
      ctx.beginPath(); ctx.arc(bx-1.5,b.y-1.5,2.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

// ── Particles ──
function drawParticles(){
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color; ctx.shadowBlur=8; ctx.shadowColor=p.color;
    ctx.save(); ctx.translate(p.x-camera.x,p.y); ctx.rotate(frameCount*0.18);
    star5(0,0,p.size*0.4,p.size);
    ctx.restore(); ctx.restore();
  });
}

// ── Rainbow trail ──
function drawRainbowTrail(){
  rainbowTrail.forEach(t=>{
    ctx.save(); ctx.globalAlpha=t.life*0.65;
    ctx.fillStyle=t.color; ctx.shadowBlur=12; ctx.shadowColor=t.color;
    ctx.beginPath(); ctx.ellipse(t.x-camera.x,t.y,t.size,t.size*0.55,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ──────────────────────────────────────────────────────────────────────────────
// ─── Realistic Unicorn ───────────────────────────────────────────────────────
// ──────────────────────────────────────────────────────────────────────────────
function drawUnicorn(px,py,facing,frame,invincible,onGround){
  ctx.save();
  ctx.translate(px+player.w/2, py+player.h/2+4);
  if(facing<0) ctx.scale(-1,1);

  // Flicker when invincible
  if(invincible>0&&Math.floor(invincible/5)%2===0){
    ctx.restore(); return;
  }

  const run=player.running, air=!onGround;
  const t=frameCount;
  const legSwing=run?Math.sin(t*0.22)*14:0;
  const bodyBob=onGround&&run?Math.sin(t*0.22)*1.5:0;

  ctx.translate(0,bodyBob);

  // ── Wings ──────────────────────────────────────────────────────────────────
  const ws=player.wingSpread;
  const wa=air?Math.sin(player.wingFlap)*0.55:Math.sin(t*0.06)*0.12;
  drawWing(ctx, -2, -8, wa, ws, t, true);  // back wing (behind body)

  // ── Shadow ─────────────────────────────────────────────────────────────────
  if(onGround){
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(0,22,20,5,0,0,Math.PI*2); ctx.fill();
  }

  // ── Tail ──────────────────────────────────────────────────────────────────
  drawTail(ctx, t);

  // ── Body ──────────────────────────────────────────────────────────────────
  // Main barrel body using gradient
  const bodyGrad=ctx.createRadialGradient(-4,-2,4,0,0,22);
  bodyGrad.addColorStop(0,'#fdf4ff');
  bodyGrad.addColorStop(0.45,'#f3e8ff');
  bodyGrad.addColorStop(0.75,'#e9d5ff');
  bodyGrad.addColorStop(1,'#c4b5fd');
  ctx.fillStyle=bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0,2,18,13,0,0,Math.PI*2);
  ctx.fill();
  // Body highlight
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(-4,-4,9,5,-0.3,0,Math.PI*2); ctx.fill();
  // Body shading
  ctx.fillStyle='rgba(100,50,160,0.12)';
  ctx.beginPath(); ctx.ellipse(2,9,13,6,0,0,Math.PI*2); ctx.fill();

  // ── Legs ──────────────────────────────────────────────────────────────────
  drawLegs(ctx, legSwing, onGround, frame, t);

  // ── Neck ──────────────────────────────────────────────────────────────────
  const neckGrad=ctx.createLinearGradient(8,-12,18,-2);
  neckGrad.addColorStop(0,'#fdf4ff'); neckGrad.addColorStop(1,'#e9d5ff');
  ctx.fillStyle=neckGrad;
  ctx.beginPath();
  ctx.moveTo(8,-12); ctx.bezierCurveTo(14,-18,20,-14,18,-4);
  ctx.bezierCurveTo(22,-2,20,4,14,2);
  ctx.bezierCurveTo(12,-2,10,-4,8,-12);
  ctx.fill();

  // ── Head ──────────────────────────────────────────────────────────────────
  drawHead(ctx, t);

  // ── Front wing (on top of body) ───────────────────────────────────────────
  drawWing(ctx, -2, -8, wa, ws, t, false);

  ctx.restore();
}

function drawWing(ctx, ox, oy, wa, ws, t, isBehind){
  ctx.save();
  ctx.translate(ox,oy);
  // isBehind = draw left/back wing (lower layer), else right/front wing
  const side=isBehind?1:-1;
  const spread=ws*(isBehind?1.15:0.9);
  const angle=wa*(isBehind?1:-1)+side*(isBehind?0.15:-0.05);

  ctx.save(); ctx.rotate(angle);

  // Wing membrane (4 bezier-curved feathers)
  const featherColors=[
    ['#f9a8d4','#fbcfe8'],['#c4b5fd','#ddd6fe'],
    ['#93c5fd','#bfdbfe'],['#6ee7b7','#a7f3d0'],
  ];
  for(let fi=0;fi<4;fi++){
    const fAngle=(fi*0.22-0.1)*side*spread;
    const fLen=30+fi*7;
    ctx.save(); ctx.rotate(fAngle-side*0.3*spread);
    ctx.globalAlpha=isBehind?0.85:0.75;
    const fg=ctx.createLinearGradient(0,0,fLen*side,0);
    fg.addColorStop(0,featherColors[fi][0]);
    fg.addColorStop(1,featherColors[fi][1]+'88');
    ctx.fillStyle=fg; ctx.shadowBlur=6; ctx.shadowColor=featherColors[fi][0];
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(
      fLen*0.4*side,-12-fi*3,
      fLen*0.8*side,-8-fi*2,
      fLen*side, fi*2
    );
    ctx.bezierCurveTo(
      fLen*0.85*side,8+fi*2,
      fLen*0.35*side,5,
      0,4
    );
    ctx.closePath(); ctx.fill();
    // Feather tip highlight
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(fLen*0.4*side,-10-fi*3,fLen*0.8*side,-6-fi*2,fLen*side,fi*2);
    ctx.stroke();
    ctx.restore();
  }
  // Wing base
  ctx.globalAlpha=1;
  const bg=ctx.createRadialGradient(0,0,0,0,0,10);
  bg.addColorStop(0,'#e9d5ff'); bg.addColorStop(1,'#c4b5fd');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.ellipse(0,2,8,6,side*0.3,0,Math.PI*2); ctx.fill();

  ctx.restore(); ctx.restore();
}

function drawTail(ctx, t){
  const colors=['#f472b6','#a78bfa','#60a5fa','#34d399','#fbbf24','#f472b6'];
  for(let i=0;i<6;i++){
    const wave=Math.sin(t*0.1+i*0.6)*8;
    const bx=-16-i*2, by=8+i*4+wave;
    ctx.save();
    ctx.fillStyle=colors[i]; ctx.globalAlpha=0.9-i*0.08;
    ctx.shadowBlur=8; ctx.shadowColor=colors[i];
    ctx.beginPath();
    ctx.bezierCurveTo(bx-3,by-10,bx-14+wave*0.5,by-4,bx-16+wave,by+6);
    if(i===0){
      ctx.moveTo(-14,4);
      ctx.bezierCurveTo(-16,by-8,-22+wave*0.4,by,bx-14+wave,by+8);
      ctx.bezierCurveTo(-18+wave*0.3,by+12,-12,by+5,-14,4);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.ellipse(bx-4+wave*0.6,by+2,5-i*0.3,8-i*0.5,-0.3+wave*0.04,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawLegs(ctx, legSwing, onGround, frame, t){
  // 4 legs with proper horse-like joints
  const legPairs=[
    {bx:-8, side:'back'},  {bx:2, side:'back2'},
    {bx:8, side:'front'}, {bx:16,side:'front2'},
  ];
  const swings=[legSwing,-legSwing,-legSwing,legSwing];
  const legGrad=(x1,y1,x2,y2,c1,c2)=>{
    const g=ctx.createLinearGradient(x1,y1,x2,y2);
    g.addColorStop(0,c1); g.addColorStop(1,c2); return g;
  };

  legPairs.forEach(({bx},i)=>{
    const sw=onGround?swings[i]:0;
    const upperLen=14, lowerLen=12;
    const upperAngle=(sw*Math.PI/180);
    const lowerAngle=Math.max(-0.2,Math.abs(upperAngle)*0.7);

    const ux1=bx, uy1=10;
    const ux2=ux1+Math.sin(upperAngle)*upperLen;
    const uy2=uy1+Math.cos(upperAngle)*upperLen;
    const lx2=ux2+Math.sin(upperAngle+lowerAngle)*lowerLen;
    const ly2=uy2+Math.cos(upperAngle+lowerAngle)*lowerLen;

    // Upper leg
    ctx.strokeStyle=legGrad(ux1,uy1,ux2,uy2,'#e9d5ff','#c4b5fd');
    ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(ux1,uy1); ctx.lineTo(ux2,uy2); ctx.stroke();
    // Lower leg
    ctx.strokeStyle=legGrad(ux2,uy2,lx2,ly2,'#ddd6fe','#a78bfa');
    ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(ux2,uy2); ctx.lineTo(lx2,ly2); ctx.stroke();
    // Hoof
    ctx.fillStyle='#7c3aed';
    ctx.shadowBlur=4; ctx.shadowColor='#a855f7';
    ctx.beginPath(); ctx.ellipse(lx2,ly2,4,3,-0.15,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // Joint dot
    ctx.fillStyle='#c4b5fd';
    ctx.beginPath(); ctx.arc(ux2,uy2,2.5,0,Math.PI*2); ctx.fill();
  });
}

function drawHead(ctx, t){
  ctx.save(); ctx.translate(19,-17);

  // Ear
  ctx.fillStyle='#f5d0fe';
  ctx.beginPath(); ctx.moveTo(4,-2);ctx.lineTo(8,-12);ctx.lineTo(12,-2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f9a8d4';
  ctx.beginPath(); ctx.moveTo(6,-3);ctx.lineTo(8,-10);ctx.lineTo(11,-3);ctx.closePath();ctx.fill();

  // Head base (horse-like elongated muzzle)
  const hg=ctx.createRadialGradient(-3,-4,2,-3,-4,14);
  hg.addColorStop(0,'#fdf4ff'); hg.addColorStop(0.6,'#f3e8ff'); hg.addColorStop(1,'#ddd6fe');
  ctx.fillStyle=hg;
  ctx.beginPath();
  ctx.moveTo(-10,0);
  ctx.bezierCurveTo(-12,-16,0,-18,6,-14);
  ctx.bezierCurveTo(10,-12,12,-6,10,0);
  ctx.bezierCurveTo(14,2,16,8,12,10);   // muzzle
  ctx.bezierCurveTo(8,14,0,12,-2,8);
  ctx.bezierCurveTo(-6,6,-10,4,-10,0);
  ctx.fill();
  // Head highlight
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.ellipse(-2,-8,5,7,0.3,0,Math.PI*2); ctx.fill();

  // Muzzle
  ctx.fillStyle='#fce7f3';
  ctx.beginPath(); ctx.ellipse(11,8,5,4,0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(12,8,1.5,1,0.3,0,Math.PI*2); ctx.fill(); // nostril

  // Eye (large, expressive)
  // White of eye
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(2,-6,5,4,0.1,0,Math.PI*2); ctx.fill();
  // Iris gradient
  const iris=ctx.createRadialGradient(2,-6,0,2,-6,3.5);
  iris.addColorStop(0,'#1e3a8a'); iris.addColorStop(0.6,'#1d4ed8'); iris.addColorStop(1,'#172554');
  ctx.fillStyle=iris;
  ctx.beginPath(); ctx.ellipse(2.5,-6,3.5,3,0.1,0,Math.PI*2); ctx.fill();
  // Pupil
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(3,-6,2,2.5,0,0,Math.PI*2); ctx.fill();
  // Eye shine
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(4,-7.5,1.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(1.5,-5,0.7,0,Math.PI*2); ctx.fill();
  // Eyelash
  ctx.strokeStyle='#1e1b4b'; ctx.lineWidth=1.2;
  for(let i=0;i<4;i++){
    const a=-0.8+i*0.5;
    ctx.beginPath();
    ctx.moveTo(2+Math.cos(a)*4.5,-6+Math.sin(a)*3.5);
    ctx.lineTo(2+Math.cos(a)*6.5,-6+Math.sin(a)*5.5);
    ctx.stroke();
  }

  // ── Mane ──────────────────────────────────────────────────────────────────
  const maneC=['#f472b6','#a78bfa','#60a5fa','#34d399','#fbbf24'];
  for(let i=0;i<5;i++){
    const mx=-2+i*1.5, my=-16+i*3;
    const mw=Math.sin(t*0.08+i)*3;
    ctx.save();
    ctx.fillStyle=maneC[i]; ctx.globalAlpha=0.95;
    ctx.shadowBlur=10; ctx.shadowColor=maneC[i];
    ctx.beginPath();
    ctx.ellipse(mx+mw,my,5,7,-0.4+i*0.15,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ── Horn ──────────────────────────────────────────────────────────────────
  ctx.save();
  ctx.translate(-1,-18); ctx.rotate(-0.1+Math.sin(t*0.08)*0.04);
  const hornLen=30;

  // Horn base glow when shooting
  if(player.hornGlow>0){
    const hgl=player.hornGlow/20;
    ctx.shadowBlur=20*hgl; ctx.shadowColor='#00ffff';
    const hg2=ctx.createRadialGradient(0,0,0,0,0,14*hgl+6);
    hg2.addColorStop(0,`rgba(0,255,255,${0.5*hgl})`);
    hg2.addColorStop(1,'rgba(0,255,255,0)');
    ctx.fillStyle=hg2;
    ctx.beginPath(); ctx.arc(0,0,14*hgl+6,0,Math.PI*2); ctx.fill();
  }

  // Spiral horn
  const hgr=ctx.createLinearGradient(0,0,0,-hornLen);
  hgr.addColorStop(0,'#c4b5fd'); hgr.addColorStop(0.3,'#f9a8d4'); hgr.addColorStop(0.65,'#fde68a'); hgr.addColorStop(1,'#fff');
  ctx.fillStyle=hgr;
  ctx.shadowBlur=player.hornGlow>0?20:8;
  ctx.shadowColor=player.hornGlow>0?'#00ffff':'#f9a8d4';
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(-5,-hornLen*0.35); ctx.lineTo(0,-hornLen); ctx.lineTo(5,-hornLen*0.35);
  ctx.closePath(); ctx.fill();
  // Spiral lines
  for(let si=0;si<3;si++){
    const sy=-hornLen*0.2-si*hornLen*0.23;
    const sw=4.5-si*1.3;
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(-sw,sy); ctx.bezierCurveTo(-sw*0.5,sy-3,sw*0.5,sy-3,sw,sy); ctx.stroke();
  }
  // Horn tip star
  ctx.fillStyle='#fff'; ctx.globalAlpha=0.7+Math.sin(t*0.15)*0.3;
  ctx.beginPath(); ctx.arc(0,-hornLen,2.5,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();

  ctx.restore();
}

// ── Alien walker ──
function drawWalker(a){
  const ax=a.x-camera.x, ay=a.y;
  ctx.save(); ctx.translate(ax+a.w/2,ay+a.h/2);
  if(a.vx<0) ctx.scale(-1,1);

  // Legs
  const lw=Math.sin(frameCount*0.2)*8;
  ctx.strokeStyle='#4ade80'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,10); ctx.lineTo(-10+lw,20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,10); ctx.lineTo(10-lw,20); ctx.stroke();

  // Body sac
  const bg=ctx.createRadialGradient(-2,-4,2,-2,-4,13);
  bg.addColorStop(0,'#bbf7d0'); bg.addColorStop(0.6,'#4ade80'); bg.addColorStop(1,'#166534');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.ellipse(0,0,13,14,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#86efac'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(0,0,13,14,0,0,Math.PI*2); ctx.stroke();

  // Belly glow
  ctx.fillStyle='rgba(134,239,172,0.25)';
  ctx.beginPath(); ctx.ellipse(-2,4,7,5,0,0,Math.PI*2); ctx.fill();

  // Head
  const hg=ctx.createRadialGradient(-1,-13,2,-1,-13,11);
  hg.addColorStop(0,'#d1fae5'); hg.addColorStop(0.6,'#6ee7b7'); hg.addColorStop(1,'#065f46');
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.ellipse(0,-14,11,10,0,0,Math.PI*2); ctx.fill();

  // Eyes (3 eyes)
  [[-5,-16],[0,-18],[5,-16]].forEach(([ex,ey],i)=>{
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(ex,ey,3,3.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=i===1?'#ff4444':'#ff0000';
    ctx.beginPath(); ctx.ellipse(ex,ey,2,2.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(ex+1,ey-1,0.9,0,Math.PI*2); ctx.fill();
  });

  // Antennae
  ctx.strokeStyle='#4ade80'; ctx.lineWidth=1.5;
  [[-4,-24],[ 4,-24]].forEach(([tx],i)=>{
    ctx.beginPath(); ctx.moveTo(i===0?-5:-3,-22);
    ctx.bezierCurveTo(i===0?-8:-1,-26,i===0?-10:-2,tx,-7+i*14,-22+Math.sin(frameCount*0.1)*3);
    ctx.stroke();
    // Antenna ball
    ctx.fillStyle=`hsl(${(frameCount*6+i*120)%360},90%,60%)`;
    ctx.beginPath(); ctx.arc(i===0?-8:6,-23+Math.sin(frameCount*0.1+i)*3,2.5,0,Math.PI*2); ctx.fill();
  });

  // Ray gun
  ctx.fillStyle='#166534';
  ctx.fillRect(12,-2,10,5); ctx.fillRect(19,-5,4,11);
  ctx.fillStyle='#ff4444'; ctx.shadowBlur=6; ctx.shadowColor='#ff0000';
  ctx.beginPath(); ctx.arc(22,-2,2,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  ctx.restore();
}

// ── UFO alien ──
function drawUFO(a){
  const ax=a.x-camera.x, ay=a.y;
  ctx.save(); ctx.translate(ax+a.w/2,ay+a.h/2);
  const hov=Math.sin(frameCount*0.06)*4;
  ctx.translate(0,hov);

  // Engine glow
  const eg=ctx.createRadialGradient(0,8,0,0,8,22);
  eg.addColorStop(0,'rgba(147,51,234,0.55)'); eg.addColorStop(1,'rgba(147,51,234,0)');
  ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,8,22,0,Math.PI*2); ctx.fill();

  // Saucer bottom dome
  const sg=ctx.createRadialGradient(0,6,0,0,6,22);
  sg.addColorStop(0,'#7c3aed'); sg.addColorStop(0.6,'#4c1d95'); sg.addColorStop(1,'#2e1065');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.ellipse(0,6,22,8,0,0,Math.PI*2); ctx.fill();
  // Bottom rim lights
  for(let i=0;i<8;i++){
    const a2=(i/8)*Math.PI*2+frameCount*0.06;
    const lc=`hsl(${(i*45+frameCount*4)%360},90%,65%)`;
    ctx.fillStyle=lc; ctx.shadowBlur=6; ctx.shadowColor=lc;
    ctx.beginPath(); ctx.arc(Math.cos(a2)*17,6+Math.sin(a2)*2,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;

  // Top dome
  const dg=ctx.createRadialGradient(-5,-4,1,-5,-4,18);
  dg.addColorStop(0,'rgba(220,200,255,0.95)'); dg.addColorStop(0.5,'rgba(167,139,250,0.85)'); dg.addColorStop(1,'rgba(109,40,217,0.7)');
  ctx.fillStyle=dg;
  ctx.beginPath(); ctx.ellipse(0,-2,16,14,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(196,181,253,0.6)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(0,-2,16,14,0,0,Math.PI*2); ctx.stroke();
  // Dome highlight
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(-5,-6,7,5,-0.4,0,Math.PI*2); ctx.fill();

  // Alien inside dome (visible through glass)
  ctx.save(); ctx.clip();
  ctx.beginPath(); ctx.ellipse(0,-2,16,14,0,0,Math.PI*2);
  ctx.fillStyle='#22c55e';
  ctx.beginPath(); ctx.ellipse(0,0,6,7,0,0,Math.PI*2); ctx.fill();
  // tiny eyes
  ctx.fillStyle='#ff0000';
  ctx.beginPath(); ctx.arc(-2,-2,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(2,-2,1.5,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // HP dots
  for(let i=0;i<a.hp;i++){
    ctx.fillStyle='#22c55e'; ctx.shadowBlur=4; ctx.shadowColor='#4ade80';
    ctx.beginPath(); ctx.arc(-4+i*8,16,3,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.restore();
}

// ── Squish splat ──
function drawSquish(a){
  if(!a.squished) return;
  const ax=a.x-camera.x;
  ctx.save();
  ctx.globalAlpha=a.squishTimer/35;
  ctx.fillStyle=a.type==='ufo'?'#7c3aed':'#4ade80';
  ctx.shadowBlur=8; ctx.shadowColor=a.type==='ufo'?'#a855f7':'#86efac';
  ctx.beginPath();
  ctx.ellipse(ax+a.w/2,a.y+a.h-4,a.w/2+6,7,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);
  drawBg();

  platforms.forEach(p=>drawPlatform(p));
  drawFlag(flag);
  coins.forEach(c=>drawCoin(c));

  // Alien bullets behind everything
  drawAlienBullets();

  // Squish effects
  aliens.forEach(a=>{ if(a.squished) drawSquish(a); });

  drawRainbowTrail();

  // Player
  if(player.alive||state==='dead'){
    drawUnicorn(player.x-camera.x, player.y, player.facing,
      player.animFrame, player.invincible, player.onGround);
  }

  // Lasers
  drawLasers();

  // Aliens
  aliens.forEach(a=>{
    if(!a.alive) return;
    a.type==='ufo'?drawUFO(a):drawWalker(a);
  });

  drawParticles();
}

// ─── Loop ────────────────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  if(state==='title'){
    frameCount++;
    bgStars.forEach(s=>s.tw+=0.03);
    // Draw title scene
    ctx.clearRect(0,0,W,H);
    drawBg();
    drawUnicorn(W/2-80,H/2-40,1,Math.floor(frameCount/8)%4,0,false);
    return;
  }
  if(state==='playing'||state==='dead') update();
  render();
}

// ─── Key handler for menu states ─────────────────────────────────────────────
document.addEventListener('keydown', ()=>{
  if(state==='title'&&wasPressed('Space','Enter')){
    hideMsg(); state='playing'; player.invincible=60;
  }
  if((state==='win'||state==='gameover')&&wasPressed('Space','Enter')){
    hideMsg(); init(); state='playing';
  }
});

// ─── Boot ────────────────────────────────────────────────────────────────────
init();
showMsg('🦄 UNICORN vs ALIENS 👾',
  'Press SPACE to start!<br>Arrow Keys / WASD: Move &nbsp;|&nbsp; W / Space / ↑: Jump (Double-Jump!)<br>Z / Ctrl: Shoot rainbow laser!');
loop();
</script>
